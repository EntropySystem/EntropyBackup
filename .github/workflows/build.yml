name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this tag (e.g. v1.6.0); leave empty to just build
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read  # SignPath downloads the unsigned artifact from this run
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # Only published builds are signed, so a SignPath approval is needed per release, not per push.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, Release x64)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Smoke test the command line
        shell: pwsh
        run: |
          $cli = "build\Release\EntropyBackupCLI.exe"
          function Check($expected) { if ($LASTEXITCODE -ne $expected) { throw "exit code $LASTEXITCODE, expected $expected" } }
          & $cli help; Check 0
          New-Item -ItemType Directory t\src\sub, t\dst | Out-Null
          Set-Content t\src\a.txt "hello"; Set-Content t\src\sub\b.txt "world"
          & $cli backup --from t\src --to t\dst --verify --desc "CI"; Check 0
          Add-Content t\src\a.txt "changed"
          & $cli backup --from t\src --to t\dst --verify; Check 0
          & $cli list --to t\dst; Check 0
          # The runner is an administrator, so the shadow copy must really be used: copy a file held open exclusively.
          $open = [System.IO.File]::Open("$PWD\t\src\sub\b.txt", 'Open', 'ReadWrite', 'None')
          & $cli backup --from t\src --to t\dst --vss --verify --keep 2; Check 0
          $open.Close()
          $snap = Get-ChildItem t\dst\EntropyBackup_Versions -Directory -Filter "snapshot_*" | Sort-Object Name | Select-Object -Last 1
          if (-not (Select-String -Path "$($snap.FullName)\backup.json" -Pattern '"shadow_copy": true' -Quiet)) { throw "shadow copy was not used" }
          if ((Get-ChildItem t\dst\EntropyBackup_Versions -Directory -Filter "snapshot_*").Count -ne 2) { throw "retention did not keep 2 snapshots" }
          Set-Content "$($snap.FullName)\files\a.txt" "corrupted"
          & $cli verify --to t\dst; Check 1
          & $cli backup --from t\missing --to t\dst; Check 2
          & $cli backup --bogus; Check 3
          Write-Host "All command-line checks passed."
          exit 0  # otherwise pwsh returns the last tool's exit code (3, from the deliberate bad-argument check)

      - name: Collect the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build\Release\EntropyBackup.exe, build\Release\EntropyBackupCLI.exe out\

      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: EntropyBackup-windows-x64-unsigned
          path: out/*.exe

      # Free code signing for open source by SignPath.io, certificate by SignPath Foundation.
      # Skipped until the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable are set.
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'EntropyBackup' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # leaves time for a manual approval in SignPath
          output-artifact-directory: signed

      - name: Verify the signatures
        id: verify
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE == 'true'
        shell: pwsh
        run: |
          foreach ($name in 'EntropyBackup.exe', 'EntropyBackupCLI.exe') {
            $sig = Get-AuthenticodeSignature "signed\$name"
            Write-Host "${name}: $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$name is not validly signed" }
            Copy-Item "signed\$name" out\ -Force
          }
          & out\EntropyBackupCLI.exe help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the signed CLI does not run" }
          "signed=true" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: EntropyBackup-windows-x64
          path: out/*.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && xcodebuild -version && swift --version

      - name: Unit tests
        run: swift test

      - name: Build the app (universal)
        run: scripts/make-app.sh

      - name: Smoke test the command line
        run: |
          app=dist/EntropyBackup.app/Contents/MacOS/EntropyBackup
          export ENTROPYBACKUP_HOME="$RUNNER_TEMP/home"
          t="$RUNNER_TEMP/t"; mkdir -p "$t/src/sub" "$t/dst"
          echo hello > "$t/src/a.txt"; echo world > "$t/src/sub/b.txt"
          check() { want=$1; shift; set +e; "$@"; rc=$?; set -e; [ "$rc" -eq "$want" ] || { echo "::error::exit $rc, expected $want: $*"; exit 1; }; }
          check 0 "$app" help
          check 0 "$app" backup --from "$t/src" --to "$t/dst" --verify --desc CI
          sleep 1; echo more >> "$t/src/a.txt"
          check 0 "$app" backup --from "$t/src" --to "$t/dst" --verify
          sleep 1; check 0 "$app" backup --from "$t/src" --to "$t/dst" --keep 2
          check 0 "$app" list --to "$t/dst"
          [ "$(ls -d "$t"/dst/EntropyBackup_Versions/snapshot_* | wc -l)" -eq 2 ] || { echo "::error::retention did not keep 2 snapshots"; exit 1; }
          snap=$(ls -d "$t"/dst/EntropyBackup_Versions/snapshot_* | tail -1)
          echo corrupted > "$snap/files/sub/b.txt"
          check 1 "$app" verify --to "$t/dst"
          check 2 "$app" backup --from "$t/missing" --to "$t/dst"
          check 3 "$app" backup --bogus
          echo "All command-line checks passed."

      - uses: actions/upload-artifact@v4
        with:
          name: EntropyBackup-macOS
          path: macos/dist/EntropyBackup-macOS.zip

  # On a v* tag, or a manual run with a release tag: one release with both downloads.
  # The Windows build alone is enough to publish.
  release:
    needs: [windows, macos]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release != '') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ inputs.release || github.ref_name }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          v="${TAG#v}"
          awk -v h="## $v" '$0 == h {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<'NOTES'

          **Downloads:** `EntropyBackup.exe` (Windows app), `EntropyBackupCLI.exe` (Windows command line) and `EntropyBackup-macOS.zip` (macOS 14 or later, Apple silicon and Intel).
          NOTES
          if [ "$SIGNED" = "true" ]; then
            echo "The Windows executables are code-signed (free code signing by SignPath.io, certificate by SignPath Foundation)." >> notes.md
          else
            echo "The Windows executables are not code-signed in this release; SmartScreen may ask you to confirm." >> notes.md
          fi
          echo "The macOS app is not notarized: open it once, then allow it in System Settings › Privacy & Security › Open Anyway." >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Entropy Backup ${{ inputs.release || github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/EntropyBackup-windows-x64/EntropyBackup.exe
            artifacts/EntropyBackup-windows-x64/EntropyBackupCLI.exe
            artifacts/EntropyBackup-macOS/EntropyBackup-macOS.zip
