name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the executables to the release on a v* tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, Release x64)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Smoke test the command line
        shell: pwsh
        run: |
          $cli = "build\Release\EntropyBackupCLI.exe"
          function Check($expected) { if ($LASTEXITCODE -ne $expected) { throw "exit code $LASTEXITCODE, expected $expected" } }
          & $cli help; Check 0
          New-Item -ItemType Directory t\src\sub, t\dst | Out-Null
          Set-Content t\src\a.txt "hello"; Set-Content t\src\sub\b.txt "world"
          & $cli backup --from t\src --to t\dst --verify --desc "CI"; Check 0
          Add-Content t\src\a.txt "changed"
          & $cli backup --from t\src --to t\dst --verify; Check 0
          & $cli list --to t\dst; Check 0
          # The runner is an administrator, so the shadow copy must really be used.
          $open = [System.IO.File]::Open("$PWD\t\src\sub\b.txt", 'Open', 'ReadWrite', 'None')
          & $cli backup --from t\src --to t\dst --vss --verify --keep 2; Check 0
          $open.Close()
          $snap = Get-ChildItem t\dst\EntropyBackup_Versions -Directory -Filter "snapshot_*" | Sort-Object Name | Select-Object -Last 1
          if (-not (Select-String -Path "$($snap.FullName)\backup.json" -Pattern '"shadow_copy": true' -Quiet)) { throw "shadow copy was not used" }
          if ((Get-ChildItem t\dst\EntropyBackup_Versions -Directory -Filter "snapshot_*").Count -ne 2) { throw "retention did not keep 2 snapshots" }
          Set-Content "$($snap.FullName)\files\a.txt" "corrupted"
          & $cli verify --to t\dst; Check 1
          & $cli backup --from t\missing --to t\dst; Check 2
          & $cli backup --bogus; Check 3
          Write-Host "All command-line checks passed."

      - uses: actions/upload-artifact@v4
        with:
          name: EntropyBackup-windows-x64
          path: |
            build/Release/EntropyBackup.exe
            build/Release/EntropyBackupCLI.exe

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)")
          ($m.Success ? $m.Groups[1].Value : "See CHANGELOG.md.") | Set-Content notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy Backup ${{ github.ref_name }}
          body_path: notes.md
          files: |
            build/Release/EntropyBackup.exe
            build/Release/EntropyBackupCLI.exe
